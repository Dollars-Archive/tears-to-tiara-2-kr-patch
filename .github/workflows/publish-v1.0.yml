name: Publish v1.0 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v1.0.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish v1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0 >/dev/null 2>&1; then
            echo "Release v1.0 already exists."
            exit 0
          fi

          gh release create v1.0 \
            --target main \
            --title "티어즈 투 티아라 2 한국어 패치 v1.0" \
            --notes-file RELEASE_v1.0.md
